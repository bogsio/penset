<!-- Header Section -->
<div class="flex items-center justify-between">
    <div>
        <div class="flex items-center space-x-4 mb-2">
            <a href="{% url 'reports:scans' %}" class="text-slate-400 hover:text-slate-200 transition-colors">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-slate-100">Scan Details</h1>
        </div>
        <p class="text-slate-300">{{ scan.description|default:"Security Scan" }}</p>
        <p class="text-sm text-slate-400 mt-1">ID: {{ scan.id }}</p>
    </div>
    <div class="flex items-center space-x-4">
        <div class="text-right">
            <span class="inline-flex px-3 py-1 text-xs font-semibold rounded-full
                {% if scan.status == 'completed' %}bg-green-500/20 text-green-300 border border-green-500/30
                {% elif scan.status == 'failed' %}bg-red-500/20 text-red-300 border border-red-500/30
                {% elif scan.status == 'processing' %}bg-yellow-500/20 text-yellow-300 border border-yellow-500/30
                {% else %}bg-slate-500/20 text-slate-300 border border-slate-500/30{% endif %}">
                {{ scan.get_status_display }}
            </span>
        </div>
    </div>
</div>
