<!-- Attack Surface History Chart -->
{% if chart_data %}
<div class="card rounded-xl overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-700 bg-gradient-to-r from-slate-800/50 to-slate-700/30">
        <div class="flex items-center space-x-3">
            <div class="h-8 w-8 bg-black border border-cyan-400 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-400/20">
                <svg class="h-5 w-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="filter: drop-shadow(0 0 3px #22d3ee);">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
            </div>
            <div>
                <h2 class="text-xl font-semibold text-slate-100">Attack Surface History</h2>
                <p class="text-slate-400 text-sm">Target count evolution over last 12 scans</p>
            </div>
        </div>
    </div>
    <div class="p-6">
        <div class="h-80">
            <canvas id="attackSurfaceChart"></canvas>
        </div>
    </div>
</div>
{% endif %}
