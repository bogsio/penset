<!-- Target Input Modal -->
<template x-if="targetModalOpen">
<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
    <div class="bg-slate-800 rounded-xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto" @click.away="targetModalOpen = false">
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-slate-700 bg-gradient-to-r from-slate-800/50 to-slate-700/30">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="h-8 w-8 bg-black border border-cyan-400 rounded-lg flex items-center justify-center shadow-lg shadow-cyan-400/20">
                        <svg class="h-5 w-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="filter: drop-shadow(0 0 3px #22d3ee);">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-xl font-semibold text-slate-100">Set Up Your Targets</h2>
                        <p class="text-slate-400 text-sm">Configure scanning targets for your organization</p>
                    </div>
                </div>
                <button @click="targetModalOpen = false" class="text-slate-400 hover:text-slate-200 transition-colors">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Modal Content -->
        <div class="p-6">
            <div class="mb-6">
                <div class="flex items-start space-x-3 p-4 bg-blue-500/10 border border-blue-500/20 rounded-lg">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-medium text-blue-300 mb-1">Getting Started</h3>
                        <p class="text-sm text-slate-300">
                            To begin scanning, you need to specify the targets (domains, IP addresses, or URLs) that your organization is authorized to scan. 
                            This information will be used to configure your security assessments.
                        </p>
                    </div>
                </div>
            </div>

            <form method="post" action="{% url 'accounts:update_targets' %}" @submit.prevent="
                const form = $el;
                const formData = new FormData(form);
                
                fetch('{% url "accounts:update_targets" %}', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
                        'X-Partial': 'true'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        targetModalOpen = false;
                        window.location.reload();
                    } else {
                        console.error('Error updating targets:', data.errors);
                        alert('Error updating targets. Please check your input.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while updating targets.');
                });
            " class="space-y-6">
                {% csrf_token %}
                
                <div class="space-y-2">
                    <label for="id_targets" class="text-sm font-semibold text-slate-200">Targets</label>
                    <textarea
                        id="id_targets"
                        name="targets"
                        rows="4"
                        class="w-full rounded-lg border border-slate-600 bg-slate-800/50 px-3 py-2.5 text-sm text-slate-100 placeholder:text-slate-400 shadow-sm transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="example.com, 192.168.1.1, https://app.example.com"
                        required
                    ></textarea>
                    <p class="text-xs text-slate-400">
                        Enter targets separated by commas. Examples: domains (example.com), IP addresses (192.168.1.1), or URLs (https://app.example.com)
                    </p>
                </div>

                <div class="space-y-3">
                    <div class="flex items-start space-x-3">
                        <input
                            type="checkbox"
                            id="id_consent_checkbox"
                            name="consent_checkbox"
                            class="mt-1 form-checkbox"
                            required
                        >
                        <div class="flex-1">
                            <label for="id_consent_checkbox" class="text-sm font-medium text-slate-200 cursor-pointer">
                                I confirm that I am authorized to scan these targets and understand the risks involved
                            </label>
                            <p class="text-xs text-slate-400 mt-1">
                                By checking this box, you confirm that you have proper authorization to scan the specified targets. 
                                Please review our <a href="#" class="text-blue-400 hover:text-blue-300 underline" target="_blank">scanning policy and legal guidelines</a> 
                                before proceeding. You understand that unauthorized scanning may violate laws and terms of service.
                            </p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-700">
                    <button
                        type="button"
                        @click="targetModalOpen = false"
                        class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-slate-100 transition-colors"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        class="px-6 py-2 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white text-sm font-medium rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg"
                    >
                        Save Targets
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</template>
