{% extends 'base.html' %}

{% block title %}Register - Penset{% endblock %}

{% block content %}
<div class="min-h-screen gradient-bg flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md card rounded-2xl shadow-2xl p-8 space-y-6">
    <div class="space-y-2 text-center">
      <h1 class="text-2xl font-bold tracking-tight text-slate-100">Create Account</h1>
      <p class="text-sm text-slate-300">Step 1: Enter your personal details</p>
    </div>

    {% if form.errors %}
      <div class="rounded-lg border border-red-400/30 bg-red-500/10 px-4 py-3 text-sm text-red-300">
        Please correct the errors below.
      </div>
    {% endif %}

    <form method="post" class="space-y-5">
      {% csrf_token %}

      <div class="space-y-2">
        <label for="id_first_name" class="text-sm font-semibold text-slate-200">First Name</label>
        <input
          type="text"
          id="id_first_name"
          name="first_name"
          value="{{ form.first_name.value|default:'' }}"
          required
          class="w-full rounded-lg border border-slate-600 bg-slate-800/50 px-3 py-2.5 text-sm text-slate-100 placeholder:text-slate-400 shadow-sm transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
      </div>

      <div class="space-y-2">
        <label for="id_last_name" class="text-sm font-semibold text-slate-200">Last Name</label>
        <input
          type="text"
          id="id_last_name"
          name="last_name"
          value="{{ form.last_name.value|default:'' }}"
          required
          class="w-full rounded-lg border border-slate-600 bg-slate-800/50 px-3 py-2.5 text-sm text-slate-100 placeholder:text-slate-400 shadow-sm transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
      </div>

      <div class="space-y-2">
        <label for="id_email" class="text-sm font-semibold text-slate-200">Email address</label>
        <input
          type="email"
          id="id_email"
          name="email"
          value="{{ form.email.value|default:'' }}"
          autocomplete="email"
          required
          class="w-full rounded-lg border border-slate-600 bg-slate-800/50 px-3 py-2.5 text-sm text-slate-100 placeholder:text-slate-400 shadow-sm transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
      </div>

      <div class="space-y-2">
        <label for="id_password1" class="text-sm font-semibold text-slate-200">Password</label>
        <input
          type="password"
          id="id_password1"
          name="password1"
          required
          class="w-full rounded-lg border border-slate-600 bg-slate-800/50 px-3 py-2.5 text-sm text-slate-100 placeholder:text-slate-400 shadow-sm transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
      </div>

      <div class="space-y-2">
        <label for="id_password2" class="text-sm font-semibold text-slate-200">Confirm Password</label>
        <input
          type="password"
          id="id_password2"
          name="password2"
          required
          class="w-full rounded-lg border border-slate-600 bg-slate-800/50 px-3 py-2.5 text-sm text-slate-100 placeholder:text-slate-400 shadow-sm transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
      </div>

      <button
        type="submit"
        class="w-full btn btn-primary inline-flex items-center justify-center rounded-lg px-4 py-2.5 text-sm font-medium text-white"
      >
        Continue to Organization Setup
      </button>
    </form>

    <p class="text-center text-sm text-slate-400">
      Already have an account? <a href="{% url 'accounts:login' %}" class="text-blue-400 hover:text-blue-300 transition-colors">Sign in here</a>
    </p>
  </div>
</div>
{% endblock %}
