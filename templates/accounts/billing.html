{% extends 'layout.html' %}

{% block main_content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">Billing</h1>
        <p class="text-slate-400">Manage your subscription and payment information.</p>
    </div>

    <!-- Billing Card -->
    <div class="card rounded-xl overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-700 bg-gradient-to-r from-slate-800/50 to-slate-700/30">
            <div class="flex items-center space-x-3">
                <div class="h-8 w-8 bg-black border border-blue-400 rounded-lg flex items-center justify-center shadow-lg shadow-blue-400/20">
                    <svg class="h-5 w-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="filter: drop-shadow(0 0 3px #60a5fa);">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-xl font-semibold text-slate-100">Billing Information</h2>
                    <p class="text-slate-400 text-sm">Subscription and payment details</p>
                </div>
            </div>
        </div>
        
        <div class="p-6">
            <div class="text-center py-12">
                <div class="mx-auto w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                    </svg>
                </div>
                <h3 class="text-lg font-medium text-slate-300 mb-2">Billing Coming Soon</h3>
                <p class="text-slate-400">Subscription and payment management features will be available here.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
