[project]
name = "penset"
version = "0.1.0"
description = "Automated Pentesting Platform - Result Visualization and Report Generation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Django==4.2.7",
    "djangorestframework==3.14.0",
    "django-cors-headers==4.3.1",
    "django-environ==0.11.2",
    "django-filter==23.5",
    "django-ses==3.5.0",
    "psycopg2-binary==2.9.9",
    "boto3==1.34.0",
    "Pillow==10.1.0",
    "celery==5.3.4",
    "redis==5.0.1",
    "whitenoise==6.6.0",
    "gunicorn==21.2.0",
    "django-storages==1.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-django==4.7.0",
    "black==23.11.0",
    "flake8==6.1.0",
    "isort==5.12.0",
    "pre-commit==3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_django = "django"
known_first_party = ["accounts", "organizations", "reports"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "penset.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations",
    "static",
    "node_modules",
]
